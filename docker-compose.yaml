services:
  api:
    build:
      context: .
    image: social-media-fastapi:0.1.0
    ports:
      - "${APP_PORT}:8000"
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    # Lightweight PostgreSQL image optimized for local development.
    # Application dependencies remain on Debian-based Python image
    # for broader package compatibility.
    image: postgres:18.4-alpine
    container_name: social-media-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
